name: Banner
status: stable
description: USWDS Government Banner Component
libraryOverrides:
  dependencies:
    - drupito_components_uswds/uswds
props:
  type: object
  properties:
    icon_path_header:
      type: string
      title: Header Icon Path
      description: "Enter the URL or path to the header flag icon."
      default: "https://designsystem.digital.gov/assets/img/us_flag_small.png"
    header_text:
      type: string
      title: Header Text
      description: Main banner title text
    action_text:
      type: string
      title: Action Text
      description: Text for toggle button
    icon_path_1:
      type: string
      title: Section 1 Icon Path
      description: "Enter the URL or path to the icon for the first guidance section."
      default: "https://designsystem.digital.gov/assets/img/icon-dot-gov.svg"
    section1_title:
      type: string
      title: Section 1 Title (Bolded)
      description: Section 1 title
    section1_content:
      type: string
      title: Section 1 Content
      description: Section 1 content
    icon_path_2:
      type: string
      title: Section 2 Icon Path
      description: "Enter the URL or path to the icon for the second guidance section."
      default: "https://designsystem.digital.gov/assets/img/icon-https.svg"

    section2_title:
      type: string
      title: Section 2 Title (Bolded) 
      description: Section 2 title
    section2_content:
      type: string
      title: Section 2 Content
      description: Section 2 content
    
    
    
    