name: USWDS Summary Box
status: stable
description: USWDS Summary Box Component
libraryOverrides:
  dependencies:
    - drupito_components_uswds/uswds
props:
  type: object
  required:
    - heading
    - items
  properties:
    heading:
      type: string
      title: Heading
      description: The heading text for the summary box.
    items:
      type: array
      title: List Items
      description: The list of items to display in the summary box.
      items:
        type: string
        title: Item
        description:  The text for each item. Use standard HTML tags to create links.
    text_format:
      type: string
      title: Text Format
      description: "Text format for item content"
      default: 'basic_html'
