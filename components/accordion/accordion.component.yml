    item_7_heading_text:
      type: string
      title: Accordion item 7 Heading Text
      description: The heading text for accordion item 7. Users can click on this text to expand or collapse the accordion item.
      default: ''
    item_8_expanded:
      type: boolean
      title: Item 8 Expanded
      description: If true, the accordion item 8 will be expanded by default.
