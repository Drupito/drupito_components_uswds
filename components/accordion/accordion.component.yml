name: Accordion
status: stable
description: USWDS Accordion Component, supports up to 10 items
libraryOverrides:
  dependencies:
    - drupito_components_uswds/uswds
props:
  type: object
  properties:
    multiselectable:
      type: boolean
      title: Multiselectable
      description: If true, multiple accordion items can be expanded at once.
      default: false
    save_state:
      type: boolean
      title: Save expanded state
      description: "If true, accordion items' expanded/collapsed states will persist for the current visitor."
      default: false
    bordered:
      type: boolean
      title: Bordered
      description: If true, expanded accordion items will have a border.
      default: false
    item_1_expanded:
      type: boolean
      title: Item 1 Expanded
      description: If true, the accordion item 1 will be expanded by default.
      default: false
    item_1_heading_text:
      type: string
      title: Accordion item 1 Heading Text
      description: The heading text for accordion item 1. Users can click on this text to expand or collapse the accordion item.
      default: ''
    item_2_expanded:
      type: boolean
      title: Item 2 Expanded
      description: If true, the accordion item 2 will be expanded by default.
      default: false
    item_2_heading_text:
      type: string
      title: Accordion item 2 Heading Text
      description: The heading text for accordion item 2. Users can click on this text to expand or collapse the accordion item.
      default: ''
    item_3_expanded:
      type: boolean
      title: Item 3 Expanded
      description: If true, the accordion item 3 will be expanded by default.
      default: false
    item_3_heading_text:
      type: string
      title: Accordion item 3 Heading Text
      description: The heading text for accordion item 3. Users can click on this text to expand or collapse the accordion item.
      default: ''
    item_4_expanded:
      type: boolean
      title: Item 4 Expanded
      description: If true, the accordion item 4 will be expanded by default.
      default: false
    item_4_heading_text:
      type: string
      title: Accordion item 4 Heading Text
      description: The heading text for accordion item 4. Users can click on this text to expand or collapse the accordion item.
      default: ''
    item_5_expanded:
      type: boolean
      title: Item 5 Expanded
      description: If true, the accordion item 5 will be expanded by default.
      default: false
    item_5_heading_text:
      type: string
      title: Accordion item 5 Heading Text
      description: The heading text for accordion item 5. Users can click on this text to expand or collapse the accordion item.
      default: ''
    item_6_expanded:
      type: boolean
      title: Item 6 Expanded
      description: If true, the accordion item 6 will be expanded by default.
      default: false
    item_6_heading_text:
      type: string
