'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: USWDS Card
status: stable
description: USWDS Card Component
libraryOverrides:
  dependencies:
    - drupito_components_uswds/uswds
props:
  type: object
  properties:
    variant:
      type: string
      title: Card Variant
      description: The variant of the card.
      enum:
        - default
        - flag
      default: default
    heading:
      type: string
      title: Card Heading
      description: The title of the card.
    heading_level:
      type: integer
      title: Heading Level
      description: The heading level for the card title.
      enum: [ 2, 3, 4, 5, 6]
      default: 2
    body:
      type: string
      title: Card body Content
      description: The content of the card body.
    image_url:
      type: string
      format: uri
      title: Image URL
      description: The URL of the image.
    image_alt:
      type: string
      title: Image Alt Text
      description: The alternative text for the image.
    media_position:
      type: string
      title: Media Position
      description: 'The position of the media element.'
      enum: [left, right]
      default: left
    media_style:
      type: string
      title: Media Style
      description: Style of the media (standard, inset, or exdent).
      enum:
        - standard
        - inset
        - exdent
      default: standard
    heading_above_media:
      type: boolean
      title: Heading Above Media
      description: If true, positions the heading above the media element instead of below.
      default: false
    button_text:
      type: string
      title: Button Text
      description: The text for the button.
    button_url:
      type: string
      format: uri-reference
      title: Button URL
      description: The URL for the button.
