name: USWDS Card
status: stable
description: USWDS Card Component
libraryOverrides:
  dependencies:
    - drupito_components_uswds/uswds
props:
  type: object
  properties:
    heading_level:
      type: number
      title: Heading Level
      default: 2
    media_variant:
      type: string
      title: Media Variant
      enum: [default, inset, exdent]
      default: default
    header_first:
      type: boolean
      title: Header First
      description: Display header before media
      default: false
    flag_layout:
      type: boolean
      title: Flag Layout
      description: Use horizontal flag layout
      default: false
    media_right:
      type: boolean
      title: Media Right Alignment
      description: Right-align media in flag layout
      default: false
slots:
  heading:
    title: Heading
    description: "Card title text (required)"
  body:
    title: Body Content
    description: Main content of the card
  media:
    title: Media
    description: HTML for image/media content
  footer:
    title: Footer Content
    description: Footer content (HTML or component)
